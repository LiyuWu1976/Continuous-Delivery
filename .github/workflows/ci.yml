name: Release Board CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
      - run: npm ci
      - run: npm run check
      - run: npm run test:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit
          path: reports/junit.xml
          if-no-files-found: error
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: release-board
          path: dist/
          if-no-files-found: error

  deploy-staging:
    name: Deploy to Staging
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.release-board.example.com
    steps:
      - name: Download release-board artifact
        uses: actions/download-artifact@v7
        with:
          name: release-board
          path: ./deploy-dist

      - name: Deploy & Smoke Test on Staging
        run: |
          echo "Deploying release-board artifact to Staging..."
                    ls -la ./deploy-dist
                    echo "Staging smoke test passed."

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://release-board.example.com
    steps:
      - name: Download exact same release-board artifact
        uses: actions/download-artifact@v7
        with:
          name: release-board
          path: ./deploy-dist

      - name: Deploy to Production
        run: |
          echo "Deploying release-board artifact to Production..."
                    ls -la ./deploy-dist
                    echo "Production release completed."
